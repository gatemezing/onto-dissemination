name: Deploy ERA Graph Explorer to GitHub Pages

on:
  push:
    branches:
      - main
      
    paths:
      - 'scripts/assets/era-graph-explorer-app.html'
      - 'scripts/assets/era-rdf-exporter.html'
      - 'scripts/assets/era-rinf-value-explorer.html'
      - 'scripts/assets/era-interop-answers.html'
      - 'scripts/assets/era-rcc-parameters.html'
      - 'scripts/assets/era-route-book.html'
      - 'scripts/assets/era-holobox-frame.html'
      - 'scripts/assets/era-ask.html'
      - 'scripts/assets/era-eurostat-exporter.html'
      - 'scripts/assets/era-eradis-explorer.html'
      - 'scripts/assets/era-shacl-viewer.html'
      - 'scripts/assets/era-skos-explorer.html'
      - 'scripts/assets/crd-rinf-comparison.html'
      - 'scripts/assets/era-op-rcc-primary-locations.html'
      - 'scripts/assets/era-synthetic-rdf.html'
      - 'scripts/assets/era-eradis-snapshot.json.gz'
      - 'scripts/assets/era-eradis-certificates.json.gz'
      - 'graphwiseAI-summit2026/connected-by-data-answers.html'
      - 'kgswc-2026-slides/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site (app becomes the Pages root)
        run: |
          mkdir -p _site
          cp scripts/assets/era-graph-explorer-app.html _site/index.html
          cp scripts/assets/era-rdf-exporter.html _site/exporter.html
          cp scripts/assets/era-rinf-value-explorer.html _site/values.html
          cp scripts/assets/era-interop-answers.html _site/interopable-eu-portal-answers.html
          cp scripts/assets/era-rcc-parameters.html _site/rcc.html
          cp scripts/assets/era-route-book.html _site/routebook.html
          cp scripts/assets/era-holobox-frame.html _site/holobox.html
          cp scripts/assets/era-ask.html _site/ask.html
          cp scripts/assets/era-eurostat-exporter.html _site/eurostat.html
          cp scripts/assets/era-eradis-explorer.html _site/eradis.html
          cp scripts/assets/era-shacl-viewer.html _site/shapes.html
          cp scripts/assets/era-skos-explorer.html _site/skos.html
          cp scripts/assets/crd-rinf-comparison.html _site/crd-rinf.html
          cp scripts/assets/era-op-rcc-primary-locations.html _site/op-rcc.html
          cp scripts/assets/era-synthetic-rdf.html _site/synthetic.html
          cp scripts/assets/era-eradis-snapshot.json.gz _site/era-eradis-snapshot.json.gz
          cp scripts/assets/era-eradis-certificates.json.gz _site/era-eradis-certificates.json.gz
          cp graphwiseAI-summit2026/connected-by-data-answers.html _site/connected-by-data.html

      # The KGSWC 2026 Slidev deck, built as a static site under /kgswc-2026/.
      # The build needs no browser: skip the dev dependencies and Playwright's browser download
      # (playwright-chromium is used only for the PDF export, run locally).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: kgswc-2026-slides/package-lock.json

      - name: Build the KGSWC 2026 slides
        working-directory: kgswc-2026-slides
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --omit=dev
          npx slidev build slides.md --base /onto-dissemination/kgswc-2026/ --out ../_site/kgswc-2026

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
