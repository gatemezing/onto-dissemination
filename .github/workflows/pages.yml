name: Deploy ERA Graph Explorer to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/railway-ontology-script-opambl
    paths:
      - 'scripts/assets/era-graph-explorer-app.html'
      - 'scripts/assets/era-rdf-exporter.html'
      - 'scripts/assets/era-rinf-value-explorer.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site (app becomes the Pages root)
        run: |
          mkdir -p _site
          cp scripts/assets/era-graph-explorer-app.html _site/index.html
          cp scripts/assets/era-rdf-exporter.html _site/exporter.html
          cp scripts/assets/era-rinf-value-explorer.html _site/values.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
