name: Refresh RINF parameter catalogue

# Re-derives the parameter/country snapshot embedded in
# scripts/assets/era-rinf-value-explorer.html from the live ERA endpoint.
#
# Schedule: 19:00 UTC is 21:00 in Europe/Paris while CEST is in force
# (late March to late October). GitHub cron has no timezone field, so from the
# October changeover the job lands at 20:00 Paris until the spring one. If that
# hour matters, add a second line `0 20 * * *` and let the winter run be the
# effective one — the job is idempotent, so an extra firing costs nothing.
#
# GitHub also queues scheduled runs on a best-effort basis and can start them
# several minutes late when the hosted fleet is busy; this job has no deadline,
# so that is harmless.

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: 'Accept a >20% drop in the catalogue (only if the drop is real)'
        type: boolean
        default: false

permissions:
  contents: write   # to commit the refreshed snapshot
  actions: write    # to trigger pages.yml (see the last step)

concurrency:
  group: refresh-rinf-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild the catalogue from graph.data.era.europa.eu
        run: |
          set -uo pipefail
          ARGS=""
          if [ "${{ inputs.allow_shrink }}" = "true" ]; then ARGS="--allow-shrink"; fi
          # The endpoint occasionally times out a batch under load. The script
          # fails loudly rather than writing a partial catalogue, so simply
          # retrying is safe — it rewrites the block from scratch each time.
          for attempt in 1 2 3; do
            echo "::group::attempt $attempt"
            if python3 scripts/build-rinf-parameter-catalog.py $ARGS; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed"
            git checkout -- scripts/assets/era-rinf-value-explorer.html
            [ "$attempt" -lt 3 ] && sleep 120
          done
          echo "::error::the catalogue rebuild failed three times — the ERA endpoint is likely down"
          exit 1

      - name: Decide whether anything but the snapshot date changed
        id: change
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, subprocess
          path = 'scripts/assets/era-rinf-value-explorer.html'
          block = re.compile(r"const META = .*?\nconst CATALOG = .*?;\n", re.S)
          new = block.search(open(path, encoding='utf-8').read()).group(0)
          old = block.search(subprocess.run(
              ['git', 'show', f'HEAD:{path}'],
              capture_output=True, text=True, check=True).stdout).group(0)
          # The snapshot date moves every day by construction. Committing that
          # alone would mean a commit and a Pages redeploy every night for no
          # actual change, so it is not on its own a reason to commit.
          undate = lambda s: re.sub(r'"snapshot":"[^"]*"', '', s)
          print('changed=' + ('true' if undate(old) != undate(new) else 'false'))
          PY

      - name: Commit and push the refreshed snapshot
        if: steps.change.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/assets/era-rinf-value-explorer.html
          git commit -m 'Refresh the RINF parameter catalogue from the live ERA endpoint'
          git push

      - name: Discard the date-only change
        if: steps.change.outputs.changed != 'true'
        run: git checkout -- scripts/assets/era-rinf-value-explorer.html

      # A push made with GITHUB_TOKEN deliberately does not trigger other
      # workflows, so pages.yml would never see this commit. Ask for it.
      - name: Redeploy GitHub Pages
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"

      - name: Report
        if: always()
        run: |
          if [ "${{ steps.change.outputs.changed }}" = "true" ]; then
            echo "### RINF catalogue updated" >> "$GITHUB_STEP_SUMMARY"
            echo "The parameter list or the country/dataset map changed; the snapshot was committed and Pages redeployed." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.change.outputs.changed }}" = "false" ]; then
            echo "### RINF catalogue checked — no change" >> "$GITHUB_STEP_SUMMARY"
            echo "Rebuilt from the live endpoint and compared: identical apart from the snapshot date, so nothing was committed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### RINF catalogue refresh failed" >> "$GITHUB_STEP_SUMMARY"
            echo "The rebuild did not complete, so the committed snapshot is untouched." >> "$GITHUB_STEP_SUMMARY"
          fi
