<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ERA Graph Explorer</title>
<style>
  :root{
    --bg1:#0b1220; --bg2:#111a2e; --center:#e8604f;
    --blue:#5b9bd5; --green:#7ac36a; --pink:#c894c8; --purple:#9b8fd1;
    --orange:#f0a83a; --teal:#5fd0ae; --lav:#8f9fe0; --lgreen:#b7dd82;
    --grey:#7a8296; --gold:#e0b64a;
    --ink:#0d1526; --paper:#eef2ff; --panel:rgba(10,16,32,.82); --line:rgba(255,255,255,.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:radial-gradient(1400px 900px at 50% 20%, var(--bg2), var(--bg1) 70%);
    font-family:"Segoe UI",Arial,sans-serif;color:var(--paper);overflow:hidden;}
  #app{position:relative;width:100%;height:100vh;min-height:640px;display:flex;flex-direction:column;}

  /* ---------- top bar ---------- */
  #topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(6,10,20,.75);
    border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:50;}
  #topbar h1{font-size:16px;margin:0 14px 0 0;font-weight:700;white-space:nowrap;
    background:linear-gradient(90deg,#8fe3c7,#8fb3ff,#e8604f);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #toolLinks{display:flex;align-items:center;gap:8px;font-size:11.5px;}
  /* --grey would sit at ~4.6:1 on this background, too tight for 11.5px text,
     so these are dimmed --paper instead: same hue, comfortably legible. */
  #toolLinks a{color:var(--paper);opacity:.72;text-decoration:none;border:1px solid var(--line);
    padding:5px 11px;border-radius:20px;white-space:nowrap;background:rgba(255,255,255,.04);}
  #toolLinks a:hover{opacity:1;background:rgba(255,255,255,.09);}
  #toolLinks a:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  #uriInput{flex:1 1 320px;min-width:200px;background:rgba(255,255,255,.06);border:1px solid var(--line);
    color:var(--paper);padding:8px 12px;border-radius:8px;font-size:13px;font-family:monospace;}
  #uriInput:focus-visible{outline:2px solid var(--blue);}
  button.btn:focus-visible, .node:focus-visible, #quickLinks .ql:focus-visible, #breadcrumb .crumb:focus-visible{
    outline:2px solid var(--teal); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    .node,.edge,.edgeLabel,#toast,button.btn{transition-duration:.01ms !important;}
  }
  button.btn{background:linear-gradient(180deg,#2a3a5c,#1c2740);border:1px solid var(--line);color:var(--paper);
    padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;}
  button.btn:hover{background:linear-gradient(180deg,#33456b,#22304d);}
  button.btn.primary{background:linear-gradient(180deg,#3f7bd1,#2c5aa3);}
  button.btn.primary:hover{background:linear-gradient(180deg,#4a89e0,#3568b3);}
  #modeToggle{display:flex;align-items:center;gap:6px;font-size:12px;color:#aebbdd;}
  #modeToggle select{background:rgba(255,255,255,.06);color:var(--paper);border:1px solid var(--line);
    border-radius:6px;padding:5px 8px;font-size:12px;}

  /* ---------- breadcrumb ---------- */
  #breadcrumb{display:flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(6,10,20,.5);
    border-bottom:1px solid var(--line);font-size:12.5px;color:#aebbdd;overflow-x:auto;white-space:nowrap;z-index:40;}
  #breadcrumb .crumb{cursor:pointer;padding:3px 9px;border-radius:6px;transition:background .15s;}
  #breadcrumb .crumb:hover{background:rgba(255,255,255,.08);color:#fff;}
  #breadcrumb .crumb.current{color:#fff;font-weight:600;background:rgba(255,255,255,.06);}
  #breadcrumb .crumb.live::after{content:"live";margin-left:6px;font-size:9.5px;font-weight:700;letter-spacing:.4px;
    text-transform:uppercase;color:var(--teal);border:1px solid rgba(95,208,174,.5);border-radius:4px;padding:1px 4px;vertical-align:1px;}
  #breadcrumb .sep{opacity:.4;}

  /* ---------- main stage ---------- */
  #stageWrap{position:relative;flex:1;overflow:hidden;}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:46px 46px;transform:perspective(900px) rotateX(55deg) translateY(80px) scale(1.6);opacity:.5;}
  #perspective{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1400px;}
  /* Static 3D tilt (not a perpetual animation): keeps the depth/perspective look
     while staying still enough to click precisely and to pass automated tests. */
  #world{position:relative;width:10px;height:10px;transform-style:preserve-3d;
    transform:rotateX(14deg) rotateY(-5deg);}

  .node{position:absolute;left:0;top:0;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;text-align:center;color:#0d1526;font-weight:700;
    font-size:13px;line-height:1.15;padding:8px;cursor:pointer;user-select:none;
    box-shadow:0 18px 34px rgba(0,0,0,.55),inset 0 8px 18px rgba(255,255,255,.35),inset 0 -14px 22px rgba(0,0,0,.18);
    opacity:0;transform:translate3d(0,0,0) scale(.4);
    transition:opacity .5s ease,transform .55s cubic-bezier(.2,.8,.25,1),box-shadow .2s ease,filter .2s ease;
    backface-visibility:hidden;}
  .node.visible{opacity:1;}
  .node:hover:not(.center){filter:brightness(1.12);transform:translate3d(var(--tx),var(--ty),var(--tz)) scale(1.07) !important;}
  .node .lbl{position:relative;z-index:2;white-space:pre-line;pointer-events:none;}
  .node::after{content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.85),rgba(255,255,255,0) 45%);pointer-events:none;}
  .node.center{width:172px;height:172px;margin:-86px 0 0 -86px;font-size:17px;cursor:default;
    background:radial-gradient(circle at 35% 30%,#ff9c8c,var(--center) 60%,#b7392b 100%);z-index:5;}
  .node.center:hover{filter:none;transform:translate3d(0,0,50px) scale(1) !important;}
  .node.blue{background:radial-gradient(circle at 35% 30%,#bcdcff,var(--blue) 60%,#366a99 100%);}
  .node.green{background:radial-gradient(circle at 35% 30%,#d3f3c8,var(--green) 60%,#4c8a41 100%);}
  .node.pink{background:radial-gradient(circle at 35% 30%,#f0d4f0,var(--pink) 60%,#8a5b8a 100%);}
  .node.purple{background:radial-gradient(circle at 35% 30%,#d9d4f7,var(--purple) 60%,#5b4fa0 100%);}
  .node.orange{background:radial-gradient(circle at 35% 30%,#ffe1b0,var(--orange) 60%,#b3781f 100%);}
  .node.teal{background:radial-gradient(circle at 35% 30%,#cdf6e8,var(--teal) 60%,#2f9c78 100%);}
  .node.lav{background:radial-gradient(circle at 35% 30%,#dbe1ff,var(--lav) 60%,#4c5bb0 100%);}
  .node.lgreen{background:radial-gradient(circle at 35% 30%,#eaf6d4,var(--lgreen) 60%,#7fa63f 100%);}
  .node.grey{background:radial-gradient(circle at 35% 30%,#c7ccd8,var(--grey) 60%,#4a5062 100%);color:#e8ebf2;}
  .node.gold{background:radial-gradient(circle at 35% 30%,#fbe6ae,var(--gold) 60%,#a5822c 100%);}

  .edge{position:absolute;left:0;top:0;height:2px;width:0;
    background:linear-gradient(90deg,rgba(255,255,255,.65),rgba(255,255,255,.85));
    transform-origin:0 50%;opacity:0;transition:opacity .4s ease,width .5s ease;pointer-events:none;}
  .edge.visible{opacity:1;}
  .edge::after{content:"";position:absolute;right:-1px;top:50%;transform:translateY(-50%);width:0;height:0;
    border-style:solid;border-width:5px 0 5px 9px;border-color:transparent transparent transparent rgba(255,255,255,.92);
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}
  .edge.reciprocal::before{content:"";position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:0;height:0;
    border-style:solid;border-width:5px 9px 5px 0;border-color:transparent rgba(255,255,255,.92) transparent transparent;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}
  .edge.incoming::after{display:none;}
  .edge.incoming::before{content:"";position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:0;height:0;
    border-style:solid;border-width:5px 9px 5px 0;border-color:transparent rgba(255,255,255,.92) transparent transparent;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}

  .edgeLabel{position:absolute;left:0;top:0;background:rgba(10,16,32,.72);border:1px solid rgba(255,255,255,.18);
    color:#d9e2ff;font-size:11px;padding:3px 8px;border-radius:10px;white-space:nowrap;opacity:0;
    transition:opacity .4s ease;z-index:6;pointer-events:none;}
  .edgeLabel.visible{opacity:1;}

  /* ---------- side panels ---------- */
  #infoPanel{position:absolute;left:16px;bottom:16px;max-width:340px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:12.5px;z-index:45;
    box-shadow:0 10px 30px rgba(0,0,0,.4);}
  #infoPanel .lbl{font-size:15px;font-weight:700;color:#fff;margin-bottom:4px;}
  #infoPanel .cls{color:#8fe3c7;font-family:monospace;font-size:11.5px;margin-bottom:6px;}
  #infoPanel .uri{color:#aebbdd;word-break:break-all;font-family:monospace;font-size:10.5px;}
  #infoPanel .note{margin-top:8px;color:#ffb066;font-size:11px;}

  #quickLinks{position:absolute;right:16px;bottom:16px;max-width:230px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:11.5px;z-index:45;
    box-shadow:0 10px 30px rgba(0,0,0,.4);max-height:46vh;overflow-y:auto;
    transition:max-height .2s ease,padding .2s ease;}
  #quickLinks .qlHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  #quickLinks h3{margin:0;font-size:11.5px;color:#aebbdd;text-transform:uppercase;letter-spacing:.5px;}
  #quickLinks .qlToggle{flex:none;background:transparent;border:1px solid var(--line);color:#aebbdd;
    border-radius:6px;padding:2px 8px;font-size:10.5px;cursor:pointer;line-height:1.5;}
  #quickLinks .qlToggle:hover{background:rgba(255,255,255,.1);color:#fff;}
  #quickLinks.collapsed{max-height:none;padding-bottom:12px;overflow:visible;}
  #quickLinks.collapsed .qlHeader{margin-bottom:0;}
  #quickLinks.collapsed #qlList{display:none;}
  #quickLinks .ql{display:block;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);
    color:var(--paper);padding:6px 9px;border-radius:7px;margin-bottom:6px;cursor:pointer;font-size:12px;}
  #quickLinks .ql:hover{background:rgba(255,255,255,.12);}

  #toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-140%);background:rgba(10,16,32,.94);
    border:1px solid var(--line);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:80;
    transition:transform .35s ease;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90%;text-align:center;}
  #toast.show{transform:translate(-50%,0);}

  #legend{position:absolute;left:50%;top:16px;transform:translateX(-50%);font-size:11px;color:#8896bd;
    background:rgba(6,10,20,.5);padding:5px 12px;border-radius:8px;z-index:40;pointer-events:none;}

  #panels{position:relative;}

  @media (max-width:760px){
    html,body{overflow:auto;height:auto;}
    #app{height:auto;min-height:100vh;}
    #stageWrap{min-height:60vh;}
    #panels{display:flex;flex-direction:column;gap:10px;padding:4px 12px 18px;}
    #infoPanel,#quickLinks{position:static;max-width:none;}
    #quickLinks{max-height:220px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>ERA Ontology Explorer</h1>
    <input id="uriInput" type="text" spellcheck="false" placeholder="Paste an ERA URI, e.g. https://data.banenor.no/data/_station_c0576848-8f76-4489-aa6e-ae95b98c1a1c">
    <button class="btn primary" id="goBtn">Go</button>
    <button class="btn" id="backBtn" title="Back">← Back</button>
    <div id="modeToggle">
      <label>Data source</label>
      <select id="modeSelect">
        <option value="demo" selected>Offline demo (verified)</option>
        <option value="live">Try live ERA SPARQL</option>
      </select>
    </div>
    <nav id="toolLinks" aria-label="Related ERA tools">
      <a href="./exporter.html" title="Export any ERA/RINF resource URI as RDF/XML">RDF Exporter</a>
      <a href="./values.html" title="Distinct values for any RINF parameter, per country, as CSV or Excel">RINF Parameter Values</a>
      <a href="./rcc.html" title="Route-compatibility parameters along one national line, by kilometre">RCC Parameters</a>
      <a href="./routebook.html" title="TSI OPE Appendix D2 route book elements for one national line">Route Book</a>
    </nav>
  </div>
  <div id="breadcrumb"></div>
  <div id="stageWrap">
    <div class="grid"></div>
    <div id="legend">Click any bubble to follow the link · drag not needed — click "follow your nose"</div>
    <div id="perspective"><div id="world"></div></div>
    <div id="toast"></div>
  </div>
  <div id="panels">
    <div id="infoPanel">
      <div class="lbl" id="ipLabel">—</div>
      <div class="cls" id="ipClass"></div>
      <div class="uri" id="ipUri"></div>
      <div class="note" id="ipNote"></div>
    </div>
    <div id="quickLinks">
      <div class="qlHeader">
        <h3>Known demo nodes</h3>
        <button class="qlToggle" id="qlToggleBtn" type="button" aria-expanded="true" aria-controls="qlList">Hide</button>
      </div>
      <div id="qlList"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   DATA MODEL — offline demo dataset
   Every node/edge here was fetched directly over HTTP during this authoring
   session — not screenshots, not invented — from two real, independent
   Linked Data sources describing Oslo S (Oslo Central Station), Norway's
   largest railway station:
     1. https://data.banenor.no/data/_station_c0576848-8f76-4489-aa6e-ae95b98c1a1c
        — Bane NOR's own Fuseki-backed Linked Data server (station, track,
        primary-location, validity, subnetwork and org resources below),
        fetched with `Accept: application/ld+json` content negotiation.
     2. https://graph.data.era.europa.eu/repositories/rinf-plus and
        /repositories/ERA-Onto — the same ERA SPARQL endpoint the live mode
        uses, queried for the shared http://data.europa.eu/949/ (era:) URIs
        that Bane NOR's data itself points to (the infrastructure-manager
        role/org, and the "station" operational-point-type concept).
   Oslo S has 482 real era:hasPart tracks, 1045 signals, 52 stopping places,
   etc. — far too many to render. As in the original Brussels Airport
   dataset, only a small, clearly-labelled representative sample is
   individually explored; every truncation is called out in a `note`
   rather than silently hidden. Unresolved reference URIs (values this
   session didn't independently dereference) are labelled from their own
   URI and marked as such, never invented.
   ========================================================================= */
const NODES = {
  opOsloS: {
    uri: 'https://data.banenor.no/data/_station_c0576848-8f76-4489-aa6e-ae95b98c1a1c',
    label: 'Oslo S', cls: 'era:OperationalPoint', swatch: 'center',
    edges: [
      {pred:'type', dir:'out', target:'classOperationalPoint'},
      {pred:'type', dir:'out', target:'classInfrastructureElement'},
      {pred:'Unique OP ID', dir:'out', target:'litUopidNOOSL'},
      {pred:'Type of operational point', dir:'out', target:'opTypeStation'},
      {pred:'Primary location', dir:'out', target:'primaryLocationNO00100'},
      {pred:'in country', dir:'out', target:'countryNorway'},
      {pred:'validity', dir:'out', target:'validityInterval2023'},
      {pred:'infrastructure manager', dir:'out', target:'imRoleHub'},
      {pred:'has part', dir:'out', target:'trackOB2'},
      {pred:'has part', dir:'out', target:'trackLeafOther'},
      {pred:'is part of / has part', dir:'reciprocal', target:'subnetworkNationaltheatret'},
      {pred:'schematic overview', dir:'out', target:'litSchematicUrl'},
      {pred:'has designator', dir:'out', target:'designatorSjnOsl'},
      {pred:'operation type', dir:'out', target:'opoperationStationPassenger'},
    ],
    note:'482 real era:hasPart tracks, 1045 signals and 52 stopping places exist for Oslo S — only one track (ØB2) is individually explored below; the rest are honestly out of scope for a readable demo, not hidden.'
  },
  trackOB2: {
    uri: 'https://data.banenor.no/data/_track_3992b0b1-1228-4033-b71e-4d64f9721182',
    label: 'ØB2', cls: 'era:Track (era:RunningTrack, secondaryTrack)', swatch: 'lgreen',
    edges: [
      {pred:'type', dir:'out', target:'classTrack'},
      {pred:'type', dir:'out', target:'classRunningTrack'},
      {pred:'type', dir:'out', target:'classInfrastructureElement'},
      {pred:'Track ID', dir:'out', target:'litTrackIdKOSPO'},
      {pred:'Track direction', dir:'out', target:'trackDirB'},
      {pred:'Maximum permitted speed', dir:'out', target:'litMaxSpeed40'},
      {pred:'Contact line system', dir:'out', target:'litContactLineNotElectrified'},
      {pred:'has track type', dir:'out', target:'litTrackType3'},
      {pred:'validity', dir:'out', target:'validityInterval2019'},
      {pred:'net reference', dir:'out', target:'netLinearRefTrackLL'},
      {pred:'Not applicable', dir:'out', target:'litNotApplicableEtcs'},
      {pred:'Not applicable', dir:'out', target:'litNotApplicableTentNetworkLevel'},
      {pred:'not yet available', dir:'out', target:'litNotYetAvailableTrainDetection'},
      {pred:'infrastructure manager', dir:'out', target:'imRoleHub'},
      {pred:'in country', dir:'out', target:'countryNorway'},
      {pred:'is part of', dir:'out', target:'opOsloS'},
      {pred:'refers to infrastructure manager (railML)', dir:'out', target:'baneNorRailml'},
    ],
    note:'Fixed 2026-08-17: this node originally omitted validity, net reference, and the real "Not applicable"/"not yet available" fields, caught by comparing it directly against graph.data.era.europa.eu\'s own view of this exact URI — now matches, reviving the honest-gap pattern (Not applicable / Not provided) the original Brussels Airport dataset used for the same TSI-style fields.'
  },
  primaryLocationNO00100: {
    uri: 'https://data.banenor.no/data/_primaryLocation_NO00100',
    label: 'Oslo S (primary location)', cls: 'era:PrimaryLocation', swatch: 'purple',
    edges: [
      {pred:'type', dir:'out', target:'classPrimaryLocation'},
      {pred:'type', dir:'out', target:'classInfrastructureElement'},
      {pred:'type', dir:'out', target:'classFeature'},
      {pred:'primary location code', dir:'out', target:'litNO00100'},
      {pred:'primary location name', dir:'out', target:'litOsloSName'},
      {pred:'validity', dir:'out', target:'validityInterval2023'},
      {pred:'in country', dir:'out', target:'countryNorway'},
      {pred:'infrastructure manager', dir:'out', target:'imRoleHub'},
      {pred:'net reference', dir:'out', target:'netAreaRefArealocation'},
      {pred:'net reference', dir:'out', target:'netPointRefSpotlocation'},
      {pred:'primary location', dir:'in', target:'opOsloS'},
    ],
    note:'Fixed 2026-08-17: this node was originally missing its era:netReference links entirely (24 real values exist — 2 representative ones shown here) plus two of its four rdf:type values, caught by comparing it directly against graph.data.era.europa.eu\'s own view of this exact URI.'
  },
  opTypeStation: {
    uri: 'http://data.europa.eu/949/concepts/op-types/10',
    label: 'station', cls: 'skos:Concept (ERA Operational Point Types)', swatch: 'orange',
    edges: [
      {pred:'type', dir:'out', target:'classSkosConcept'},
      {pred:'prefLabel (es)', dir:'out', target:'litEstacion'},
      {pred:'definition', dir:'out', target:'litStationDefinition'},
      {pred:'notation', dir:'out', target:'lit10'},
    ],
    note:'The exact same concept URI (era:concepts/op-types/10) that classified Brussels Airport in the original version of this demo — a genuine cross-country interoperability example: Bane NOR (Norway) and Infrabel/RINF (Belgium) both reuse the one shared ERA vocabulary term for "station".'
  },
  validityInterval2023: {
    uri: 'https://data.banenor.no/data/_validity_interval__timeinstant_2023-09-17_no_end_known',
    label: 'Validity from 2023-09-17 (no end known)', cls: 'era:TemporalFeature / time:Interval', swatch: 'center',
    edges: [
      {pred:'type', dir:'out', target:'classTemporalFeature'},
      {pred:'type', dir:'out', target:'classTemporalEntity'},
      {pred:'type', dir:'out', target:'classTimeInterval'},
      {pred:'has beginning', dir:'out', target:'timeinstant2023'},
      {pred:'validity', dir:'in', target:'opOsloS'},
      {pred:'validity', dir:'in', target:'primaryLocationNO00100'},
      {pred:'validity', dir:'in', target:'trackViaValidityHub'},
    ],
    note:'A real reuse hub, bigger than first shown: querying this exact URI directly returns 23 real incoming `validity` links (Oslo S, its primary location, several of its own tracks, and multiple lower-level netElement/netRelation resources) — only 3 representative ones are individually modelled here, not the full set. Same "shared node" pattern the original Brussels Airport demo highlighted, confirmed at real scale.'
  },
  timeinstant2023: {
    uri: 'https://data.banenor.no/data/_timeinstant_2023-09-17',
    label: 'date_2023-09-17', cls: 'time:Instant', swatch: 'blue',
    edges: [
      {pred:'type', dir:'out', target:'classTimeInstant'},
      {pred:'in XSD date', dir:'out', target:'lit20230917'},
      {pred:'has beginning', dir:'in', target:'validityInterval2023'},
    ]
  },
  imRoleHub: {
    uri: 'http://data.europa.eu/949/organisations/0076_IM',
    label: 'IM role of the body with organisation code 0076', cls: 'era:OrganisationRole', swatch: 'gold',
    edges: [
      {pred:'type', dir:'out', target:'classOrganisationRole'},
      {pred:'has organisation role', dir:'out', target:'litRoleIM'},
      {pred:'role of', dir:'out', target:'baneNorEra'},
      {pred:'infrastructure manager', dir:'in', target:'opOsloS'},
      {pred:'infrastructure manager', dir:'in', target:'trackOB2'},
      {pred:'infrastructure manager', dir:'in', target:'primaryLocationNO00100'},
    ],
    note:'Queried directly from the ERA SPARQL endpoint (graph.data.era.europa.eu/repositories/rinf-plus), not from Bane NOR — the exact same era:OrganisationRole pattern the original Infrabel imRoleHub used, reused here 3× by Oslo S, its track, and its primary location.'
  },
  baneNorEra: {
    uri: 'http://data.europa.eu/949/organisations/0076',
    label: 'Bane NOR', cls: 'era:Body', swatch: 'gold',
    edges: [
      {pred:'type', dir:'out', target:'classBody'},
      {pred:'organisation code', dir:'out', target:'lit0076'},
      {pred:'role', dir:'out', target:'imRoleHub'},
    ]
  },
  baneNorRailml: {
    uri: 'https://data.banenor.no/data/_im01',
    label: 'Bane NOR (railML organisational unit)', cls: 'railml3:OrganizationalUnit', swatch: 'gold',

/* URI/id lookup: accept a real URI, a demo: id, or a bare key */
function resolveInput(raw){
  const s = raw.trim();
  if(!s) return null;
  if(NODES[s]) return s;
  for(const k in NODES){ if(NODES[k].uri === s) return k; }
  return null;

const world = document.getElementById('world');
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg, ms){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), ms||2600);
}
function hideToast(){
  clearTimeout(toastTimer);
  toastEl.classList.remove('show');
}

/* A failed live fetch deserves more than the ordinary auto-dismissing toast:
   it needs to say what actually happened and stay up until the reader has
   read it, with a way to retry without re-clicking the node. */
function toastError(diag, retry){
  clearTimeout(toastTimer);
  const e = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  toastEl.innerHTML = '<b>' + e(diag.title) + '</b> — ' + e(diag.message) +
    (retry ? ' <button type="button" id="toastRetry" style="background:none;border:1px solid rgba(255,255,255,.4);' +
      'color:#fff;border-radius:6px;padding:2px 9px;cursor:pointer;font:inherit;margin-left:6px;">Try again</button>' : '') +
    ' <button type="button" id="toastClose" aria-label="Dismiss" style="background:none;border:none;color:#fff;' +
    'opacity:.65;cursor:pointer;font-size:15px;margin-left:6px;line-height:1;vertical-align:-1px;">×</button>';
  toastEl.classList.add('show');
  document.getElementById('toastClose').addEventListener('click', hideToast);
  if(retry) document.getElementById('toastRetry').addEventListener('click', () => { hideToast(); retry(); });
}

/* ------------------------------------------------------------------ *
 * Fetch error diagnosis — shown instead of a raw browser error string.
 *
 * Browsers deliberately hide *why* a cross-origin request failed: a CORS
 * block, a DNS failure, "connection refused" and being offline all throw the
 * same generic TypeError, worded differently per browser and meaningless to
 * whoever reads it. Telling them apart takes a follow-up probe, not just
 * reading err.message — a plain no-cors fetch to the same origin resolves
 * (even though its body can't be read) whenever the server is reachable at
 * all, and rejects only on a genuine connectivity failure. That is the one
 * signal a page is allowed to observe, and it is enough to tell "the server
 * said no" from "there was no server to ask" — the two failures that call
 * for different next steps. Confirmed against this endpoint's live CORS
 * regression (2026-09-03): a GET/POST that returns real data over curl still
 * throws this generic error in a browser, with zero Access-Control-Allow-*
 * headers on the actual response — not just the preflight. */
async function describeFetchError(err, endpoint){
  if(err && err.name === 'AbortError')
    return {title:'Timed out', message:'The request took too long and was cancelled.', detail:String(err.message || err)};
  const m = /^HTTP (\d+)/.exec((err && err.message) || '');
  if(m){
    const code = +m[1];
    const KNOWN = {
      400:['The endpoint rejected this query', 'This is almost always a bug in this tool’s query, not something you did — worth reporting.'],
      403:['The endpoint refused this request', 'Access to this query or resource may be restricted right now.'],
      404:['The endpoint address has changed', 'This tool may be pointing at a URL that no longer exists.'],
      500:['The endpoint hit an internal error', 'This is on the server side — try again in a moment.'],
      502:['The endpoint is temporarily unreachable', 'A gateway in front of it returned an error — try again shortly.'],
      503:['The endpoint is overloaded or busy', 'It rejected the request rather than queue it — try again in a moment, or narrow the query.'],
      504:['The endpoint took too long to respond', 'It may be under heavy load — try again, or narrow the query.'],
    };
    const known = KNOWN[code] || ['The endpoint returned an error', 'HTTP ' + code + ' — see technical detail below.'];
    return {title:known[0], message:known[1], detail:err.message};
  }
  let reachable = false;
  try{ await fetch(new URL(endpoint).origin + '/', {mode:'no-cors', cache:'no-store'}); reachable = true; }
  catch{ reachable = false; }
  if(reachable)
    return {
      title:'Blocked by your browser, not by you',
      message:'The server responded, but didn’t grant this page permission to read cross-origin responses (a missing CORS header) — a configuration issue on the endpoint’s side, not something to fix here.',
      detail:String((err && err.message) || err),
    };
  return {
    title:'Could not reach the server',
    message:(typeof navigator !== 'undefined' && navigator.onLine === false)
      ? 'Your device appears to be offline — check your connection and try again.'
      : 'The endpoint didn’t respond at all. It may be down, or something on your network is blocking the request.',
    detail:String((err && err.message) || err),
  };
}

function el(tag, cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }

// Bubble size/font scale with label length (sqrt curve, so it grows fast for
// short labels and levels off for long ones) so long live-data text fits
// inside its bubble instead of overflowing a fixed-size circle.
function bubbleMetrics(label, isCenter){
  const len = (label||'').replace(/\n/g,' ').length;
  const minD = isCenter ? 150 : 104, maxD = isCenter ? 260 : 200;
  const diameter = Math.round(Math.min(maxD, minD + Math.sqrt(len) * (isCenter ? 11 : 9)));
  const minF = isCenter ? 12.5 : 9.5, maxF = isCenter ? 17 : 13;
  const fontSize = Math.max(minF, maxF - Math.max(0, len - 10) * 0.09);
  return {diameter, fontSize};
}

function renderNode(id, x, y, z, isCenter, onClick){
  const data = NODES[id];
  const swatch = isCenter ? 'center' : (data.swatch === 'center' ? 'lav' : data.swatch);
  const n = el('div', 'node ' + swatch + (isCenter?' center':''));
  const s = el('span','lbl'); s.textContent = data.label;
  n.appendChild(s);
  const {diameter, fontSize} = bubbleMetrics(data.label, isCenter);
  n.style.width = diameter+'px';
  n.style.height = diameter+'px';
  n.style.margin = (-diameter/2)+'px 0 0 '+(-diameter/2)+'px';
  n.style.fontSize = fontSize+'px';
  n.style.setProperty('--tx', x+'px'); n.style.setProperty('--ty', y+'px'); n.style.setProperty('--tz', z+'px');
  n.style.transform = `translate3d(${x}px,${y}px,${z}px) scale(.4)`;
  world.appendChild(n);
  requestAnimationFrame(()=>{
    n.classList.add('visible');
    n.style.transform = `translate3d(${x}px,${y}px,${z}px) scale(1)`;
  });
  n.setAttribute('role','button');
  n.setAttribute('tabindex', isCenter ? '-1' : '0');
  n.setAttribute('aria-label', (isCenter?'Current: ':'Follow link to: ') + data.label.replace(/\n/g,' '));
  if(!isCenter && onClick){
    n.addEventListener('click', onClick);
    n.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onClick(); } });
  } else if(isCenter){
    n.addEventListener('click', ()=> showInfo(id));
  }
  return n;
}

// Trims the line to the gap between the two bubbles' surfaces (r1/r2 are
// their radii) instead of drawing center-to-center, so it shrinks — down to
// a short stub, never disappearing — when bubbles sit close together
// instead of running underneath them unchanged.
function renderEdge(x1,y1,z1,x2,y2,z2,dirClass,r1,r2){
  const dx=x2-x1, dy=y2-y1, fullLen=Math.sqrt(dx*dx+dy*dy)||1, rad=Math.atan2(dy,dx), ang=rad*180/Math.PI;
  const visibleLen = Math.max(10, fullLen - r1 - r2);
  const startX = x1 + Math.cos(rad)*r1, startY = y1 + Math.sin(rad)*r1;
  const e = el('div','edge'+(dirClass?(' '+dirClass):''));
  e.style.transform = `translate3d(${startX}px,${startY}px,${(z1+z2)/2}px) rotate(${ang}deg)`;
  e.style.width='0px';
  world.appendChild(e);
  requestAnimationFrame(()=>{ e.classList.add('visible'); e.style.width = visibleLen+'px'; });
  return {midX: startX + Math.cos(rad)*visibleLen/2, midY: startY + Math.sin(rad)*visibleLen/2};
}

function renderLabel(text, x, y, z){
  const l = el('div','edgeLabel');
  l.textContent = text;
  l.style.transform = `translate3d(${x}px,${y}px,${z}px) translate(-50%,-50%)`;
  world.appendChild(l);
  requestAnimationFrame(()=> l.classList.add('visible'));
  return l;
}

function showInfo(id){
  const data = NODES[id];
  document.getElementById('ipLabel').textContent = data.label;
  document.getElementById('ipClass').textContent = data.cls;
  document.getElementById('ipUri').textContent = data.uri;
  document.getElementById('ipNote').textContent = data.note || '';
  document.getElementById('uriInput').value = data.uri;
}

function renderBreadcrumb(){
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = '';
  const trail = history_.concat([currentId]); // ancestors + the node we're actually on
  trail.forEach((id, i)=>{
    if(i>0){ const sep = el('span','sep'); sep.textContent='→'; bc.appendChild(sep); }
    const isCurrent = i === trail.length-1;
    const isLive = !!NODES[id].live;
    const c = el('span','crumb'+(isCurrent?' current':'')+(isLive?' live':''));
    c.textContent = NODES[id].label.replace(/\n/g,' ');
    if(!isCurrent){
      c.setAttribute('role','button'); c.setAttribute('tabindex','0');
      c.addEventListener('click', ()=> goTo(id, true));
      c.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); goTo(id, true); } });
    }
    bc.appendChild(c);
  });
}

function clearWorld(){ world.innerHTML=''; }

const stageWrapEl = document.getElementById('stageWrap');
const WORLD_BASE_TRANSFORM = 'rotateX(14deg) rotateY(-5deg)';
let lastMaxExtent = 0;
// Bubble/radius sizing above is purely content-driven (label length, edge
// count) and can produce a layout wider than a phone or a narrow booth
// tablet — previously that overflow was just clipped by #stageWrap's
// overflow:hidden, silently hiding bubbles. This scales the whole #world
// down (uniformly, via CSS transform — every child's own translate3d
// position scales with it) to fit whatever space is actually available,
// so nothing goes off-screen. Never scales up past 1 (no benefit to
// blowing up a small graph on a big monitor).
function applyWorldScale(maxExtent){
  lastMaxExtent = maxExtent;
  const availW = stageWrapEl.clientWidth, availH = stageWrapEl.clientHeight;
  const margin = 0.88;
  const scale = Math.min(1, (availW * margin) / (2 * maxExtent), (availH * margin) / (2 * maxExtent));
  world.style.transform = `${WORLD_BASE_TRANSFORM} scale(${scale})`;
}
window.addEventListener('resize', ()=>{ if(lastMaxExtent > 0) applyWorldScale(lastMaxExtent); });

function layout(centerId){
  clearWorld();
  const data = NODES[centerId];
  renderNode(centerId, 0, 0, 50, true);
  showInfo(centerId);

  const edges = data.edges;
  const n = edges.length;
  const centerR = bubbleMetrics(data.label, true).diameter / 2;
  const targetDiams = edges.map(e => bubbleMetrics(NODES[e.target].label, false).diameter);
  // Radius scales with both edge count and the actual bubble sizes in this
  // view (bigger for nodes with long live-data labels), so a ring of many
  // large bubbles spreads out enough that neighbours don't overlap.
  const avgDiam = n === 0 ? 0 : targetDiams.reduce((sum, d) => sum + d, 0) / n;
  const Rsized = (n * (avgDiam + 26)) / (2 * Math.PI * 0.82);
  const R = Math.max(280, Math.min(460, Rsized));
  edges.forEach((edge, i)=>{
    const angle = -90 + i*(360/Math.max(n,1));
    const rad = angle*Math.PI/180;
    const x = R*Math.cos(rad), y = R*Math.sin(rad)*0.82, z = 30*Math.sin(i*1.7);
    renderNode(edge.target, x, y, z, false, ()=> goTo(edge.target));
    const mid = renderEdge(0,0,50, x,y,z, edge.dir==='reciprocal'?'reciprocal':(edge.dir==='in'?'incoming':''), centerR, targetDiams[i]/2);
    renderLabel(edge.pred, mid.midX, mid.midY, (50+z)/2);
  });

  const maxTargetR = targetDiams.length ? Math.max(...targetDiams) / 2 : 0;
  applyWorldScale(R + Math.max(centerR, maxTargetR));
}

async function goTo(id, isBreadcrumbJump){
  if(!NODES[id]){ toast('No cached data for this node yet.'); return; }
  if(NODES[id].live && NODES[id].unloaded){
    toast('Fetching live data from graph.data.era.europa.eu…', 8000);
    try{
      await buildLiveNode(NODES[id].uri, id);
      hideToast();
    } catch(err){
      const diag = await describeFetchError(err, LIVE_ENDPOINT);
      toastError(diag, () => goTo(id, isBreadcrumbJump));
      return;
    }
  }
  if(!isBreadcrumbJump){
    if(currentId){
      const crossingDataSource = !!NODES[currentId].live !== !!NODES[id].live;
      if(crossingDataSource){
        // Crossing between the offline (verified) dataset and live SPARQL
        // data starts a fresh trail instead of appending, so the breadcrumb
        // never shows a single path mixing curated and live-fetched nodes.
        history_.length = 0;
      } else {
        history_.push(currentId);
      }
    }
  } else {
    const idx = history_.indexOf(id);
    if(idx>=0) history_.length = idx;
  }
  currentId = id;
  layout(id);
  renderBreadcrumb();
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  if(history_.length===0){ toast('Already at the start.'); return; }
  const prev = history_.pop();
  currentId = prev;
  layout(prev);
  renderBreadcrumb();
});

/* =========================================================================
   LIVE SPARQL MODE
   Endpoint: https://graph.data.era.europa.eu/repositories/rinf-plus
   (the GraphDB repository behind the ERA graph browser at
   graph.data.era.europa.eu/graphs-visualizations — "RINF+ using ERA
   Ontology 3.1.x", found via that server's /repositories listing).
   Verified reachable and correctly configured for browser use:
   a GET query for the Brussels Airport demo URI returned real matching
   data, and the response carries an Access-Control-Allow-Origin header
   that reflects the requesting origin, so cross-origin fetch() works.
   (A previously-tried endpoint, rinf.data.era.europa.eu/api/v1/sparql/rinf,
   does not work from a browser: GET requests to it hang with no response,
   and while POST works over plain HTTP, its CORS policy allows only its
   own app's origin — so it rejects every other origin's preflight.)
   Also confirmed (2026-08-17): this repository mirrors more than ERA's own
   RINF data — querying a Bane NOR URI directly (e.g.
   https://data.banenor.no/data/_primaryLocation_NO00100) against this same
   endpoint returns real matching data too, though only the subset of
   properties that map onto the shared ERA vocabulary (era:validity,
   era:netReference, era:infrastructureManager, etc.) — Bane NOR's own
   native railML3/bno: extension properties are not mirrored here and only
   show up when dereferencing the resource directly from data.banenor.no.
   ========================================================================= */
const LIVE_ENDPOINT = 'https://graph.data.era.europa.eu/repositories/rinf-plus';
const LIVE_EDGE_LIMIT = 30; // keep the graph readable; real hub nodes can have far more
const ERA_NAMESPACE = 'http://data.europa.eu/949/';
const ERA_ONTOLOGY_GRAPH = 'http://data.europa.eu/949/graph/rinf/ontology';
// ERA's full SKOS controlled-vocabulary system (op-types, organisation-roles,
// track-running-directions, etc. — ~14,700 skos:Concepts across ~130
// skos:ConceptSchemes, confirmed by direct query) lives in this named graph.
const ERA_SKOS_GRAPH = 'http://data.europa.eu/949/graph/rinf/skos';

async function sparqlSelect(query, timeoutMs){
  const url = LIVE_ENDPOINT + '?query=' + encodeURIComponent(query);
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), timeoutMs || 8000);
  try{
    const res = await fetch(url, {headers:{Accept:'application/sparql-results+json'}, signal: ctrl.signal});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    return json.results.bindings;
  } finally {
    clearTimeout(t);
  }
}

function liveLocalName(uri){
  const m = uri.match(/([^/#]+)\/?$/);
  return m ? decodeURIComponent(m[1]) : uri;
}

async function fetchLiveTriples(uri){
  // For any resource in the ERA ontology namespace (http://data.europa.eu/949/),
  // explicitly pull in what ERA's own ontology and SKOS graphs say about it —
  // rdfs:comment / rdfs:subClassOf / owl:disjointWith from the ontology graph
  // (most useful when uri is a class, e.g. era:PrimaryLocation, reached via a
  // 'type' edge from an instance), and skos:prefLabel / skos:definition /
  // skos:notation / skos:broader-narrower from the SKOS graph (most useful
  // when uri is a controlled-vocabulary concept, e.g. one of the ~14,700
  // concepts under era:concepts/..., reached via a value-typed property like
  // era:opType or era:trackDirection). Together these match what
  // graph.data.era.europa.eu's visual graph shows for that URI as subject.
  // This endpoint's default (GRAPH-less) query already includes both named
  // graphs — confirmed by direct testing, byte-identical either way — so
  // these branches are explicit/robust rather than silently relying on that
  // store-specific default, and SELECT DISTINCT means any resulting
  // duplicate rows collapse before LIMIT is applied, so it can't shrink the
  // results either.
  const ontologyClause = uri.startsWith(ERA_NAMESPACE)
    ? `UNION { GRAPH <${ERA_ONTOLOGY_GRAPH}> { <${uri}> ?p ?other } BIND("out" AS ?dir) }
       UNION { GRAPH <${ERA_SKOS_GRAPH}> { <${uri}> ?p ?other } BIND("out" AS ?dir) }`
    : '';
  const query = `SELECT DISTINCT ?other ?p ?dir WHERE {
    { <${uri}> ?p ?other . BIND("out" AS ?dir) }
    UNION
    { ?other ?p <${uri}> . BIND("in" AS ?dir) }
    ${ontologyClause}
  } LIMIT ${LIVE_EDGE_LIMIT}`;
  return sparqlSelect(query, 8000);
}

async function fetchLiveLabels(uris){
  if(uris.length === 0) return {};
  const values = uris.map(u => '<'+u+'>').join(' ');
  const query = `SELECT ?uri ?label WHERE {
    VALUES ?uri { ${values} }
    OPTIONAL { ?uri <http://www.w3.org/2000/01/rdf-schema#label> ?l1 . FILTER(lang(?l1)="en"||lang(?l1)="") }
    OPTIONAL { ?uri <http://www.w3.org/2004/02/skos/core#prefLabel> ?l2 . FILTER(lang(?l2)="en"||lang(?l2)="") }
    BIND(COALESCE(?l1,?l2) AS ?label)
  }`;
  const rows = await sparqlSelect(query, 8000);
  const map = {};
  rows.forEach(r => { if(r.label) map[r.uri.value] = r.label.value; });
  return map;
}

const liveNodeKeyByUri = new Map();
let liveCounter = 0;

// Fetches uri's triples + best-effort labels and (re)populates NODES[key] in place.
// Linked URI resources become lightweight "unloaded" placeholder nodes that fetch
// their own data lazily, the moment a visitor actually clicks through to them —
// the same "follow your nose" pattern as the offline dataset, but live.
async function buildLiveNode(uri, key){
  const triples = await fetchLiveTriples(uri);
  const uriSet = new Set([uri]);
  triples.forEach(t => { uriSet.add(t.p.value); if(t.other.type === 'uri') uriSet.add(t.other.value); });

  let labels = {};
  try{ labels = await fetchLiveLabels(Array.from(uriSet)); }
  catch(e){ /* labels are best-effort; edges still render using local names */ }

  const edges = triples.map(t => {
    const predLabel = labels[t.p.value] || liveLocalName(t.p.value);
    let targetKey;
    if(t.other.type === 'uri'){
      const ouri = t.other.value;
      if(liveNodeKeyByUri.has(ouri)){
        targetKey = liveNodeKeyByUri.get(ouri);
      } else {
        targetKey = 'live:' + (liveCounter++);
        liveNodeKeyByUri.set(ouri, targetKey);
        NODES[targetKey] = {
          uri: ouri, label: labels[ouri] || liveLocalName(ouri),
          cls: 'live resource (click to follow)', swatch: 'lav',
          edges: [], live: true, unloaded: true
        };
      }
    } else {
      targetKey = 'live:' + (liveCounter++);
      NODES[targetKey] = {
        uri: null, label: t.other.value,
        cls: t.other['xml:lang'] ? ('literal value, @'+t.other['xml:lang']) : 'literal value',
        swatch: 'grey', edges: [], live: true
      };
    }
    return {pred: predLabel, dir: t.dir.value, target: targetKey};
  });

  NODES[key] = {
    uri, label: labels[uri] || liveLocalName(uri), cls: 'live resource', swatch: 'center',
    edges, live: true,
    note: edges.length >= LIVE_EDGE_LIMIT
      ? `Live data from graph.data.era.europa.eu — showing the first ${LIVE_EDGE_LIMIT} links; this resource may have more.`
      : 'Live data from graph.data.era.europa.eu — not part of the verified offline dataset.'
  };
  liveNodeKeyByUri.set(uri, key);
}

async function handleGo(){
  const raw = document.getElementById('uriInput').value.trim();
  if(!raw) return;
  const mode = document.getElementById('modeSelect').value;
  const known = resolveInput(raw);
  if(known){ goTo(known); return; }
  if(mode === 'live'){
    let key = liveNodeKeyByUri.get(raw);
    if(!key){
      key = 'live:' + (liveCounter++);
      NODES[key] = {
        uri: raw, label: liveLocalName(raw), cls: 'live resource (loading…)',
        swatch: 'lav', edges: [], live: true, unloaded: true
      };
    }
    goTo(key);
  } else {
    toast('That URI isn\'t in the offline demo set. Try one of the "Known demo nodes" on the right, or switch Data source to "Try live ERA SPARQL".', 4500);
  }
}

document.getElementById('goBtn').addEventListener('click', handleGo);
document.getElementById('uriInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleGo(); });

/* boot */
const startId = 'opOsloS';
history_.length = 0;
currentId = startId;
layout(startId);
renderBreadcrumb();
</script>
</body>
